<style>
  * { box-sizing: border-box; }
  body {

    width: 100%;

    border-radius: 18px;
  }
  .caption {
    margin: 20px 0 4px;
    font-family: Arial, sans-serif;
    font-size: 1.05rem;
  }
  .heart {
    font-size: 1.6rem;
    margin-top: 8px;
