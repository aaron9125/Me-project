<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story 💕</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            margin: 20px;
        }
        h1 {
            color: #ff4b6e;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .names {
            font-size: 1.2rem;
            font-weight: bold;
            color: #666;
            margin-bottom: 20px;
        }
        .photo-container {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .message {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        .heart {
            color: #ff4b6e;
            font-size: 1.5rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Forever Yours <span class="heart">❤️</span></h1>
        <div class="names">Your Name & Partner's Name</div>
        
        <!-- Replace 'couple-photo.jpg' with your actual image file name if it's different -->
        <div class="photo-container">
            <img src="couple-photo.jpg" alt="Us Together">
        </div>

        <p class="message">
            Every moment with you feels like a dream come true. Thank you for bringing so much love, laughter, and light into my life. Here's to us and all our tomorrows! ✨
        </p>

        <div class="names" style="font-size: 0.9rem; color: #ff4b6e;">
            I love you endlessly.
        </div>
    </div>

</body>
</html>
